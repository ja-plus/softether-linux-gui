[package]
name = "softether-tray"
version = "0.1.0"
description = "A Linux tray client for SoftEther VPN"
edition = "2021"
rust-version = "1.77.2"
default-run = "softether-tray"

[lib]
name = "softether_tray_lib"
path = "src/lib.rs"

[[bin]]
name = "softether-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
